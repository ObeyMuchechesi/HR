name: Auto-heal Vercel deployments

# Vercel's edge occasionally sticks deployments in a 404 NOT_FOUND state
# even though they are READY (observed 2026-09-28). A fresh deployment
# (alias reassignment) clears it. Pushing an empty commit makes both
# GitHub-connected Vercel projects (callcentral-hr-api + frontend)
# rebuild, so no Vercel credentials are needed in Actions.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-heal
  cancel-in-progress: false

jobs:
  check-and-heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check backend health (expect 200)
        id: backend
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://callcentral-hr-api.vercel.app/)
          echo "backend status: $CODE"
          echo "ok=$([ "$CODE" = "200" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Check frontend API proxy (expect 401 = alive, no credentials sent)
        id: frontend
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://frontend-obey-muchechesi.vercel.app/api/employees)
          echo "frontend proxy status: $CODE"
          echo "ok=$([ "$CODE" = "401" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Heal by pushing empty commit (forces fresh Vercel deploys)
        if: steps.backend.outputs.ok == 'no' || steps.frontend.outputs.ok == 'no'
        run: |
          git config user.name "autoheal-bot"
          git config user.email "autoheal-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: auto-heal - Vercel edge 404 detected, forcing redeploy"
          git push
